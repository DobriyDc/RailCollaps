# Профиль проекта Rail Link: Collapse для студии (gamestudio/). Читается через `. .studio/project.conf`
# из корня дерева в Git Bash. Студия движка не знает: всё про ArcEngine живёт здесь.
# Проверено 2026-10-29: Windows 11, Node.js 26.13.0, ArcEngine (JS + Babylon.js 9.26).

export PATH="/c/Program Files/nodejs:$PATH"

# Зависимостей нет: ArcEngine без npm и без сборки.
INSTALL_CMD="true"
# Ворота: тесты движка и игры (node --test). Типы (tsc через npx) включим после первой загрузки TypeScript.
GATES_CMD="node tools/check.mjs --tests"
# Съёмки эталонных кадров пока нет: видимые правки доказываются скриншотом из браузера в отчёте.
SHOTS_CMD=""
HEADLESS_GAMES_CMD=""

# Логический экран: портрет 360x640, рендер с увеличением без сглаживания.
LOGICAL_BOX="360x640"
SCALES="2"
WORST_LOCALE="ru"

# Зоны очереди «имя:пути». Карточки одной зоны отдаются одному воркеру пачкой.
ZONES=(
  "rules:js/Collapse*.js tests/collapse*.test.mjs"
  "scene:js/World3D.js js/Terrain3D.js js/Location3D.js js/CameraControl.js js/Model3D.js js/Gltf3D.js js/Instances3D.js js/Debug3D.js"
  "ui:js/UI.js js/UILayout.js"
  "art:art_src assets"
  "engine:tools _utils libs unity"
  "design:GAME.md docs"
)
RULE_ZONES="js/Collapse*.js js/Constants.js"

PROD_FIND="find js -name '*.js'"
STYLE_FIND="find . -path ./libs -prune -o -path ./node_modules -prune -o -name '*.css' -print"
TEST_FIND="find tests -name '*.mjs'"
DOC_FIND="find . -path ./gamestudio -prune -o -path ./libs -prune -o -path ./claude -prune -o -name '*.md' -print"
PROD_EXT=".js,.mjs,.css,.html,.json"

WORKTREES_DIR=".worktrees"
OURS_RE="orca/workspaces|collapse|dev-server|node|codex|claude .*--model"

ORCA_REPO="path:D:/Railgramm/collapse"
TRUNK="main"
